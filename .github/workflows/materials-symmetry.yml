name: materials-symmetry
on:
  push:
    paths:
      - "materials-symmetry/**"
      - ".github/workflows/materials-symmetry.yml"
  pull_request:
    paths:
      - "materials-symmetry/**"
      - ".github/workflows/materials-symmetry.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: materials-symmetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[all,dev]'
      - run: ruff check .
      - run: pytest -q
